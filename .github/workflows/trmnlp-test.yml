name: trmnlp test

on:
  push:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Rewrite the Linux snapshots and upload them
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The shipped spec builds the squeezed copy with the repo's own tools (esbuild).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: tools

      - name: trmnlp test
        run: >
          docker run --rm -e CI=true -v "$PWD":/repo -w /repo/plugin trmnl/trmnlp:v0.18.1
          test ${{ inputs.update_snapshots && '--update' || '' }}

      - if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: plugin/tests/snapshots/linux
